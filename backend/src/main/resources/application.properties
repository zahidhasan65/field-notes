spring.application.name=field-notes-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/field_notes}
spring.datasource.username=${DB_USERNAME:fieldnotes}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jackson.time-zone=UTC

spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=INFO

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# File uploads (note photos)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
app.upload-dir=${UPLOAD_DIR:uploads}

# Forgot password demo mode: true = OTP is returned in the API response (no e-mail provider yet).
# Set DEV_OTP_ENABLED=false in production and send the OTP by e-mail.
app.auth.dev-otp-enabled=${DEV_OTP_ENABLED:true}

# "Continue with Google": OAuth *Web application* client id (see GOOGLE_SETUP.md in the project root)
app.google.client-id=${GOOGLE_CLIENT_ID:}
